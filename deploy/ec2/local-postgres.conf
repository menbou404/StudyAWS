# ドロップインは既存ユニットを編集せず設定を追加・上書きする仕組みで、<unit>.service.d/*.conf がマージされる。
# Phase 2 の同一サーバーの PostgreSQL 専用として、次の両方に配置する。
# /etc/systemd/system/statuspage-api.service.d/local-postgres.conf と /etc/systemd/system/statuspage-worker.service.d/local-postgres.conf
# Phase 3 で RDS に移行したら両方を削除し、systemctl daemon-reload を実行する。
# After= は起動順序だけを指定し、Wants= は無効化（disable）された postgresql.service も起動対象に加える。
[Unit]
After=postgresql.service
Wants=postgresql.service
