# /etc/nginx/conf.d/statuspage.conf に配置する。
# Compose の ports に相当する唯一の入口をリバースプロキシに集約する。
# Phase 4 では ALB がこの入口を置き換える、または前段に加わる。
server {
    # IPv4 と IPv6 の両方で待ち受ける。IPv4 だけだと、`localhost` が ::1（IPv6）になったとき、
    # nginx.conf に最初からある server ブロック（[::]:80 で待ち受ける）が応答してしまう。
    listen 80;
    listen [::]:80;
    server_name _;

    # Phase 4 の実験で ALB 配下の応答元インスタンスを確認する。502 などのエラーにも付けるため always を使う。
    add_header X-Served-By $hostname always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        # 元のホスト名と接続元を渡し、プロキシ経由でもリクエストの情報を保つ。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 接続元の履歴と元のスキームを伝え、URL 生成やログに使えるようにする。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
